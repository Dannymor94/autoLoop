name: Offline attempt and economics gates

on:
  pull_request:
  workflow_dispatch:

# Offline only. No Claude/Codex subscription token, API key, GitHub write
# credential or public network callback is required for these tests.
permissions:
  contents: read

jobs:
  offline:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check contracts and generated instructions
        run: |
          python scripts/validate_contracts.py
          python scripts/generate_agent_docs.py --check
      - name: Exercise crash, billing and economic tests
        shell: bash
        run: |
          python -m unittest discover -s tests -v > offline-tests.log 2>&1 || { tail -n 120 offline-tests.log; exit 1; }
          tail -n 8 offline-tests.log
      - name: Run disposable fixture harness without live models
        shell: bash
        run: |
          python -m unittest discover -s pilot/fixture/harness_tests -v > fixture-tests.log 2>&1 || { tail -n 120 fixture-tests.log; exit 1; }
          tail -n 8 fixture-tests.log
      - name: Upload offline evidence for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-gates-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            offline-tests.log
            fixture-tests.log
          if-no-files-found: warn
          retention-days: 7
